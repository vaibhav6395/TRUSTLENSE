app:
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    root: ${FILE_STORAGE_ROOT:./var/trustlens-files}
  mfa:
    encryption-key: ${MFA_ENCRYPTION_KEY:}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
spring:
  application:
    name: trustlens-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trustlens}
    username: ${DB_USERNAME:trustlens}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
springdoc:
  swagger-ui:
    path: /swagger-ui.html
