name: Build and security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test
        working-directory: backend

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t trustlens-backend:ci .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t trustlens-frontend:ci .

  zero-trust-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trustlens
          POSTGRES_USER: trustlens
          POSTGRES_PASSWORD: trustlens_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustlens -d trustlens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/trustlens
      DB_USERNAME: trustlens
      DB_PASSWORD: trustlens_ci_password
      COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DEMO_DATA_ENABLED: "true"
      DEMO_FACULTY_PASSWORD: TrustLensFacultyCI#2026
      DEMO_ADMIN_PASSWORD: TrustLensAdminCI#2026
      MFA_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package backend
        run: mvn -B -DskipTests package
        working-directory: backend
      - name: Start API and wait for health
        working-directory: backend
        run: |
          java -jar target/trustlens-api-0.1.0-SNAPSHOT.jar > /tmp/trustlens-api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/api/v1/health >/dev/null; then
              echo "TRUSTLENS API is healthy"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/trustlens-api.log
          exit 1
      - name: Prove grant revocation blocks an active session and reused file URL
        run: bash security-tests/e2e-smoke.sh
