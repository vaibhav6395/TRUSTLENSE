services:
  db:
    image: postgres:16-alpine
    container_name: trustlens-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trustlens
      POSTGRES_USER: trustlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "5432:5432"
    volumes:
      - trustlens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustlens -d trustlens"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trustlens_pgdata:
