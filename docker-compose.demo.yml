services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trustlens
      POSTGRES_USER: trustlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - trustlens_demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustlens -d trustlens"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [trustlens-demo]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/trustlens
      DB_USERNAME: trustlens
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DEMO_DATA_ENABLED: "true"
      DEMO_FACULTY_PASSWORD: ${DEMO_FACULTY_PASSWORD:?Set DEMO_FACULTY_PASSWORD in .env}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Set DEMO_ADMIN_PASSWORD in .env}
      FILE_STORAGE_ROOT: /var/lib/trustlens/files
    volumes:
      - trustlens_demo_files:/var/lib/trustlens/files
    depends_on:
      db:
        condition: service_healthy
    networks: [trustlens-demo]

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    networks: [trustlens-demo]

networks:
  trustlens-demo:

volumes:
  trustlens_demo_pgdata:
  trustlens_demo_files:
